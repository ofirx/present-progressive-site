<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="3: The house — The Split. Enter the haunted castle." />
  <title>3: The house — The Split</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=61" />
</head>
<body class="castle-body">
  <header class="site-header castle-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><strong>The Split</strong><img class="logo-icon" src="images/the-split-icon.png" alt="" width="40" height="40" /></a>
      <nav aria-label="Main">
        <a href="american-survey.html" class="nav-link">1: The reasons behind</a>
        <a href="index.html" class="nav-link">2: Presenting...</a>
        <a href="practice.html" class="nav-link" aria-current="page">3: The house</a>
        <a href="quiz.html" class="nav-link">Quiz</a>
        <a href="references.html" class="nav-link">References</a>
      </nav>
    </div>
  </header>

  <main class="castle-immersive" id="castle-app">
    <section class="castle-view is-active" id="view-exterior" data-view="exterior" aria-label="Split-level castle">
      <img
        class="castle-bg castle-bg--cutaway"
        src="images/haunted-castle-split-levels.png"
        alt="A split haunted castle with basement, entrance hall, and three floors"
      />
      <div class="castle-vignette" aria-hidden="true"></div>

      <div class="castle-hotspots" aria-label="Castle levels">
        <!-- top to bottom: third floor → basement -->
        <button type="button" class="castle-hotspot" data-level="4" style="top: 8%; height: 16%;" aria-label="Third floor">
          <span class="castle-hotspot-name">Third floor</span>
        </button>
        <button type="button" class="castle-hotspot" data-level="3" style="top: 24%; height: 15%;" aria-label="Second floor">
          <span class="castle-hotspot-name">Second floor</span>
        </button>
        <button type="button" class="castle-hotspot" data-level="2" style="top: 39%; height: 15%;" aria-label="First floor">
          <span class="castle-hotspot-name">First floor</span>
        </button>
        <button type="button" class="castle-hotspot" data-level="1" style="top: 54%; height: 16%;" aria-label="Entrance hall">
          <span class="castle-hotspot-name">Entrance hall</span>
        </button>
        <button type="button" class="castle-hotspot" data-level="0" style="top: 70%; height: 18%;" aria-label="Basement">
          <span class="castle-hotspot-name">Basement</span>
        </button>
      </div>

      <p class="castle-hint">step inside</p>
    </section>

    <section class="castle-view" id="view-interior" data-view="interior" hidden aria-label="Inside the castle">
      <img class="castle-bg castle-bg--interior" src="images/haunted-castle-interior.png" alt="" />
      <div class="castle-depth-tint" id="depth-tint" aria-hidden="true"></div>
      <div class="castle-vignette" aria-hidden="true"></div>

      <div class="castle-text-panel" aria-live="polite">
        <p class="castle-floor-name" id="castle-floor-name"></p>
        <p class="castle-section-text is-bolding" id="castle-text"></p>
      </div>

      <button type="button" class="castle-move castle-move--up" id="btn-up" aria-label="Go higher">▲</button>
      <button type="button" class="castle-move castle-move--down" id="btn-down" aria-label="Go deeper">▼</button>
      <button type="button" class="castle-exit" id="btn-exit" aria-label="Leave the castle">↩</button>

      <div class="castle-depth-dots" id="depth-dots" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    (function () {
      // Index 0 = basement (bottom) … 4 = third floor (top)
      const floorNames = [
        "Basement",
        "Entrance hall",
        "First floor",
        "Second floor",
        "Third floor"
      ];
      const texts = [
        "The basement contains the project’s deepest interpretation. Freud’s ideas about the id, ego, superego, the uncanny, repression, and the fear of eyes provide a later psychoanalytic lens for reading Poe. The descent ends with the argument that guilt and conscience cannot simply be silenced or buried. In both stories, repression returns through reflection, sound, repetition, and confession.",
        "Visitors begin at the entrance hall, where the two stories and the central idea are introduced: in both texts, the apparent threat seems external, but the deeper source of horror lies within the narrator’s own mind.",
        "As the visitor moves lower through the house, the focus shifts towards historical and cultural interpretation. These windows explore Poe’s nineteenth-century American context, including individualism, social respectability, crime, urban growth, sensational print culture, and anxieties beneath national ideas of progress and rationality.",
        "The next level connects the stories to contemporary American life through issues such as curated online identities, narcissism, social pressure, anxiety, true-crime culture, and the need to appear controlled.",
        "The upper floors present the visible elements of the stories, including brief summaries, key quotations, the narrators’ crimes, and Poe’s use of mirrors, repetition, sound, masks, enclosed spaces, and unreliable narration. These rooms are designed to feel relatively orderly, representing the surface level of the narratives."
      ];

      let level = 1;
      const exterior = document.getElementById("view-exterior");
      const interior = document.getElementById("view-interior");
      const textEl = document.getElementById("castle-text");
      const floorNameEl = document.getElementById("castle-floor-name");
      const tint = document.getElementById("depth-tint");
      const dots = document.getElementById("depth-dots");
      const btnUp = document.getElementById("btn-up");
      const btnDown = document.getElementById("btn-down");

      texts.forEach(() => {
        const d = document.createElement("span");
        d.className = "castle-dot";
        dots.appendChild(d);
      });

      function boldText() {
        textEl.classList.remove("is-bolding");
        void textEl.offsetWidth;
        floorNameEl.textContent = floorNames[level];
        textEl.textContent = texts[level];
        textEl.classList.add("is-bolding");
      }

      function updateInterior() {
        boldText();
        tint.dataset.depth = String(level);
        interior.dataset.depth = String(level);
        const dotNodes = dots.querySelectorAll(".castle-dot");
        // dots drawn top→bottom visually: reverse so top dot = third floor
        dotNodes.forEach((dot, i) => {
          const mapped = texts.length - 1 - i;
          dot.classList.toggle("is-active", mapped === level);
        });
        btnUp.disabled = level >= texts.length - 1;
        btnDown.disabled = level <= 0;
      }

      function showView(name) {
        const showExterior = name === "exterior";
        exterior.hidden = !showExterior;
        interior.hidden = showExterior;
        exterior.classList.toggle("is-active", showExterior);
        interior.classList.toggle("is-active", !showExterior);
        document.body.classList.toggle("is-inside-castle", !showExterior);
      }

      function enterAt(nextLevel) {
        level = nextLevel;
        showView("interior");
        updateInterior();
      }

      document.querySelectorAll(".castle-hotspot").forEach((btn) => {
        btn.addEventListener("click", () => enterAt(Number(btn.dataset.level)));
      });

      document.getElementById("btn-exit").addEventListener("click", () => {
        showView("exterior");
      });

      btnUp.addEventListener("click", () => {
        if (level < texts.length - 1) {
          level += 1;
          updateInterior();
        }
      });

      btnDown.addEventListener("click", () => {
        if (level > 0) {
          level -= 1;
          updateInterior();
        }
      });

      window.addEventListener("keydown", (e) => {
        if (interior.hidden) return;
        if (e.key === "ArrowUp") {
          e.preventDefault();
          btnUp.click();
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          btnDown.click();
        } else if (e.key === "Escape") {
          document.getElementById("btn-exit").click();
        }
      });
    })();
  </script>
</body>
</html>
